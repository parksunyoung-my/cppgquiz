<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6f54" />
  <title>CPPG 문제은행 — 개인정보관리사 시험 대비</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- 마크다운 렌더러 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="app-header">
    <button id="homeBtn" class="header-btn brand" title="홈으로" aria-label="홈으로">
      <span class="brand-mark">CPPG</span>
      <span class="brand-sub">문제은행</span>
    </button>
    <div class="header-actions">
      <button id="themeBtn" class="header-btn icon" title="다크/라이트 전환" aria-label="테마 전환">◐</button>
      <button id="resetBtn" class="header-btn icon" title="데이터 초기화" aria-label="데이터 초기화">↺</button>
    </div>
  </header>

  <main id="app" class="app-main" aria-live="polite"></main>

  <footer class="app-footer">
    <small>CPPG 학습용 · 정답/해설은 참고용이며 최신 법령은 원문 확인 필요</small>
  </footer>

  <!-- 데이터 로드: questions.json (서버) → questions.fallback.js (file://) 순으로 시도 -->
  <script src="js/app.js"></script>
</body>
</html>
